spring.config.import=optional:file:./.env[.properties]
spring.application.name=opsflow-backend
server.port=${PORT:8080}

# PostgreSQL / Aiven. Set these variables in your local environment or deployment platform.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway manages schema changes; Hibernate only validates the migrated schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Comma-separated list of allowed frontend origins, with no trailing slash.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.org.springframework.security=WARN
